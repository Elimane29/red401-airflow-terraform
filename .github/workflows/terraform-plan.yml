# Runs terraform plan on pull requests that touch the platform.
name: terraform-plan

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-plan.yml"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_organization_name: ${{ secrets.SF_ORGANIZATION_NAME }}
      TF_VAR_account_name: ${{ secrets.SF_ACCOUNT_NAME }}
      TF_VAR_user: ${{ secrets.SF_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
      - name: Write the private key from the secret (never echo it)
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SF_PRIVATE_KEY" > "$RUNNER_TEMP/rsa_key.p8"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/rsa_key.p8" >> "$GITHUB_ENV"
      - run: terraform fmt -check
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -no-color
